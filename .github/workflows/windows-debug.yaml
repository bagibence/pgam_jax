name: windows-debug

permissions: {}

on:
  workflow_dispatch:
  push:
    branches:
      - ci_on_windows

jobs:
  repro:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash  # Git Bash. Avoids PowerShell syntax.
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true
          cache-suffix: "v2"

      - name: Install
        run: uv sync --locked --extra dev

      - name: Run each repro case in its own process
        timeout-minutes: 40
        run: |
          script=.github/debug/windows_crash_repro.py
          # Python on Windows prints CRLF. Strip the CR so the names match.
          cases=$(uv run --locked --extra dev python "$script" --list | tr -d '\r')
          summary=""
          failed=0
          # pgam_jax forces x64 on import, so only the jax_ cases run with x64=0.
          for x64 in 1 0; do
            for case in $cases; do
              if [ "$x64" = 0 ] && [[ "$case" != jax_* ]]; then continue; fi
              for i in 1 2; do
                echo "::group::x64=$x64 $case run $i"
                if JAX_ENABLE_X64=$x64 timeout 300 uv run --locked --extra dev python "$script" "$case"; then
                  status=ok
                else
                  status="FAIL (exit $?)"
                  failed=1
                fi
                echo "::endgroup::"
                summary+="x64=$x64 $case run $i: $status"$'\n'
              done
            done
          done
          echo "===== summary ====="
          printf '%s' "$summary"
          [ "$failed" -eq 0 ]
